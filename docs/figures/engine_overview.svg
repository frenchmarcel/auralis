<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img" aria-label="Auralis engine overview: the scene feeds a wave-based FDTD solver and a geometrical-acoustics solver, joined by a zero-phase complementary crossover at the transition frequency; the hybrid impulse responses give the room-acoustic parameters and the auralisation."><title>Auralis engine overview</title><style>
.bg { fill: #ffffff; stroke: #d0d7de; }
text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 12.5px; fill: #1f2328; }
text.t1 { font-weight: 600; }
text.lab { font-size: 11.5px; fill: #59636e; }
text.note { font-size: 11.5px; fill: #59636e; font-style: italic; }
text.ttl { font-size: 15px; font-weight: 600; }
.box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.2; }
.box.wv { stroke: #0969da; stroke-width: 1.6; }
.box.gm { stroke: #bc4c00; stroke-width: 1.6; }
.dash { fill: none; stroke: #1f2328; stroke-width: 1.1; stroke-dasharray: 6 4; }
.ln { fill: none; stroke: #1f2328; stroke-width: 1.3; }
.ln.wv { stroke: #0969da; } .ln.gm { stroke: #bc4c00; } .ln.dl { stroke-dasharray: 5 4; }
.ah { fill: #1f2328; } .ah.wv { fill: #0969da; } .ah.gm { fill: #bc4c00; }
</style><defs><marker id="ov-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="ov-wv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah wv" d="M0,0 L10,5 L0,10 z"/></marker><marker id="ov-gm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah gm" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1179" height="399" rx="6"/><rect class="box " x="20" y="40" width="162" height="50" rx="2"/><text class="t1" x="101" y="62" text-anchor="middle">Geometry</text><text class="" x="101" y="76" text-anchor="middle">triangles, layers</text><path class="ln " d="M182,65 H214"/><rect class="box " x="20" y="106" width="162" height="50" rx="2"/><text class="t1" x="101" y="128" text-anchor="middle">Materials</text><text class="" x="101" y="142" text-anchor="middle">α 63 Hz–8 kHz, scattering</text><path class="ln " d="M182,131 H214"/><rect class="box " x="20" y="172" width="162" height="50" rx="2"/><text class="t1" x="101" y="194" text-anchor="middle">Sources</text><text class="" x="101" y="208" text-anchor="middle">directivity, trajectory</text><path class="ln " d="M182,197 H214"/><rect class="box " x="20" y="238" width="162" height="50" rx="2"/><text class="t1" x="101" y="260" text-anchor="middle">Receivers</text><text class="" x="101" y="274" text-anchor="middle">position, head (HRTF)</text><path class="ln " d="M182,263 H214"/><rect class="box " x="20" y="304" width="162" height="50" rx="2"/><text class="t1" x="101" y="326" text-anchor="middle">Air</text><text class="" x="101" y="340" text-anchor="middle">T, RH → c, ISO 9613-1</text><path class="ln " d="M182,329 H214"/><path class="ln " d="M214,65 V329"/><rect class="box wv" x="250" y="30" width="230" height="118" rx="2"/><text class="t1" x="365" y="58" text-anchor="middle">Wave-based solver (FDTD)</text><text class="" x="365" y="72" text-anchor="middle">voxel grid, dx = c / (13.5 fc)</text><text class="" x="365" y="86" text-anchor="middle">conformal cut-cell boundaries</text><text class="" x="365" y="100" text-anchor="middle">passive wall filters (impedance)</text><text class="" x="365" y="114" text-anchor="middle">4th-order stencil on 1–4 GPUs</text><text class="" x="365" y="128" text-anchor="middle">free-field calibration</text><rect class="box gm" x="250" y="232" width="230" height="118" rx="2"/><text class="t1" x="365" y="260" text-anchor="middle">Geometrical acoustics</text><text class="" x="365" y="274" text-anchor="middle">image sources (specular part)</text><text class="" x="365" y="288" text-anchor="middle">UTD edge diffraction</text><text class="" x="365" y="302" text-anchor="middle">stochastic ray tracing</text><text class="" x="365" y="316" text-anchor="middle">size-dependent scattering</text><text class="" x="365" y="330" text-anchor="middle">→ events, energy echogram</text><path class="ln wv" d="M214,89 H250" marker-end="url(#ov-wv)"/><path class="ln gm" d="M214,291 H250" marker-end="url(#ov-gm)"/><text class="lab" x="232" y="82" text-anchor="middle">scene</text><text class="lab" x="232" y="284" text-anchor="middle">scene</text><rect class="box gm" x="560" y="256" width="160" height="70" rx="2"/><text class="t1" x="640" y="281" text-anchor="middle">Synthesis</text><text class="" x="640" y="295" text-anchor="middle">binaural (HRTF)</text><text class="" x="640" y="309" text-anchor="middle">Ambisonics, order 1–5</text><path class="ln gm" d="M480,291 H560" marker-end="url(#ov-gm)"/><path class="ln wv" d="M480,89 H760" marker-end="url(#ov-wv)"/><text class="lab" x="620" y="82" text-anchor="middle">pressure at the probes</text><rect class="box wv" x="760" y="69" width="110" height="40" rx="2"/><text class="" x="815" y="93" text-anchor="middle">low-pass fc</text><rect class="box gm" x="760" y="271" width="110" height="40" rx="2"/><text class="" x="815" y="295" text-anchor="middle">high-pass fc</text><path class="ln gm" d="M720,291 H760" marker-end="url(#ov-gm)"/><rect class="dash" x="510" y="168" width="230" height="48"/><text class="" x="625" y="189" text-anchor="middle">Crossover frequency fc</text><text class="" x="625" y="203" text-anchor="middle">auto: cell budget + Schroeder</text><path class="ln  dl" d="M740,184 H815 V109" marker-end="url(#ov-k)"/><path class="ln  dl" d="M740,200 H815 V271" marker-end="url(#ov-k)"/><path class="ln  dl" d="M510,192 H365 V148" marker-end="url(#ov-k)"/><circle class="box" cx="920" cy="190" r="17"/><path class="ln" d="M912,190 H928 M920,182 V198"/><path class="ln " d="M870,89 H920 V173" marker-end="url(#ov-k)"/><path class="ln " d="M870,291 H920 V207" marker-end="url(#ov-k)"/><text class="lab" x="912" y="150" text-anchor="end">zero-phase</text><text class="lab" x="912" y="162" text-anchor="end">crossover</text><rect class="box " x="980" y="160" width="180" height="60" rx="2"/><text class="t1" x="1070" y="187" text-anchor="middle">Hybrid impulse responses</text><text class="" x="1070" y="201" text-anchor="middle">binaural + Ambisonics</text><path class="ln " d="M937,190 H980" marker-end="url(#ov-k)"/><rect class="box " x="980" y="40" width="180" height="60" rx="2"/><text class="t1" x="1070" y="67" text-anchor="middle">Auralisation</text><text class="" x="1070" y="81" text-anchor="middle">static or moving sources</text><path class="ln " d="M1070,160 V100" marker-end="url(#ov-k)"/><rect class="box " x="980" y="280" width="180" height="60" rx="2"/><text class="t1" x="1070" y="307" text-anchor="middle">Room-acoustic parameters</text><text class="" x="1070" y="321" text-anchor="middle">ISO 3382-1, G, SPL, STI</text><path class="ln " d="M1070,220 V280" marker-end="url(#ov-k)"/><text class="lab" x="1077" y="254" text-anchor="start">omni IR (W)</text><text class="note" x="590" y="385" text-anchor="middle">Blue: wave band, below fc.  Orange: geometrical band.  Solid: signal.  Dashed: control.</text></svg>
