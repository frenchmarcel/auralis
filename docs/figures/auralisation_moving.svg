<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="Moving-source auralisation: the direct path runs through a variable delay, an interpolated read that produces the Doppler shift and HRTFs cross-faded from hop to hop; early reflections, late reverberation and the wave band are added, then all sources and a diffuse background."><title>Moving-source auralisation</title><style>
.bg { fill: #ffffff; stroke: #d0d7de; }
text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 12.5px; fill: #1f2328; }
text.t1 { font-weight: 600; }
text.lab { font-size: 11.5px; fill: #59636e; }
text.note { font-size: 11.5px; fill: #59636e; font-style: italic; }
text.ttl { font-size: 15px; font-weight: 600; }
.box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.2; }
.box.wv { stroke: #0969da; stroke-width: 1.6; }
.box.gm { stroke: #bc4c00; stroke-width: 1.6; }
.dash { fill: none; stroke: #1f2328; stroke-width: 1.1; stroke-dasharray: 6 4; }
.ln { fill: none; stroke: #1f2328; stroke-width: 1.3; }
.ln.wv { stroke: #0969da; } .ln.gm { stroke: #bc4c00; } .ln.dl { stroke-dasharray: 5 4; }
.ah { fill: #1f2328; } .ah.wv { fill: #0969da; } .ah.gm { fill: #bc4c00; }
</style><defs><marker id="mv-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="mv-wv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah wv" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mv-gm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah gm" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0.5" y="0.5" width="1179" height="469" rx="6"/><rect class="dash" x="110" y="18" width="650" height="40"/><text class="" x="435" y="42" text-anchor="middle">Trajectories of the sources and the listener (positions, head orientation)</text><text class="t1" x="20" y="128" text-anchor="start">anechoic</text><text class="t1" x="20" y="142" text-anchor="start">signal</text><path class="ln " d="M20,152 H60"/><path class="ln " d="M60,152 H110" marker-end="url(#mv-k)"/><rect class="box " x="110" y="125" width="150" height="56" rx="2"/><text class="t1" x="185" y="150" text-anchor="middle">Variable delay</text><text class="" x="185" y="164" text-anchor="middle">and 1/r</text><path class="ln  dl" d="M185,58 V125" marker-end="url(#mv-k)"/><text class="lab" x="193" y="82" text-anchor="start">distance, retarded</text><text class="lab" x="193" y="96" text-anchor="start">emission time</text><rect class="box " x="300" y="125" width="140" height="56" rx="2"/><text class="t1" x="370" y="150" text-anchor="middle">Interpolation</text><text class="" x="370" y="164" text-anchor="middle">(Doppler)</text><path class="ln " d="M260,153 H300" marker-end="url(#mv-k)"/><rect class="box " x="490" y="110" width="130" height="38" rx="2"/><text class="" x="555" y="133" text-anchor="middle">HRTF of hop k</text><rect class="box " x="490" y="160" width="130" height="38" rx="2"/><text class="" x="555" y="183" text-anchor="middle">HRTF of hop k − 1</text><path class="ln " d="M440,153 H465 V129"/><path class="ln " d="M465,153 V179"/><path class="ln " d="M465,129 H490" marker-end="url(#mv-k)"/><path class="ln " d="M465,179 H490" marker-end="url(#mv-k)"/><path class="ln  dl" d="M555,58 V110" marker-end="url(#mv-k)"/><text class="lab" x="563" y="82" text-anchor="start">direction, head</text><text class="lab" x="563" y="96" text-anchor="start">orientation, 7 bands</text><rect class="box " x="660" y="110" width="100" height="88" rx="2"/><text class="t1" x="710" y="144" text-anchor="middle">Crossfade</text><text class="" x="710" y="158" text-anchor="middle">2048-sample</text><text class="" x="710" y="172" text-anchor="middle">windows</text><path class="ln " d="M620,124 H660" marker-end="url(#mv-k)"/><path class="ln " d="M620,134 H660" marker-end="url(#mv-k)"/><path class="ln " d="M620,174 H660" marker-end="url(#mv-k)"/><path class="ln " d="M620,184 H660" marker-end="url(#mv-k)"/><path class="ln " d="M60,152 V400"/><path class="ln " d="M60,260 H110" marker-end="url(#mv-k)"/><rect class="box " x="110" y="235" width="510" height="50" rx="2"/><text class="t1" x="365" y="257" text-anchor="middle">⊗ early reflections of the current hop</text><text class="" x="365" y="271" text-anchor="middle">image sources + UTD, recomputed every hop (43 ms at 48 kHz)</text><path class="ln " d="M620,260 H660" marker-end="url(#mv-k)"/><rect class="box " x="660" y="235" width="100" height="50" rx="2"/><text class="t1" x="710" y="257" text-anchor="middle">Crossfade</text><text class="" x="710" y="271" text-anchor="middle">per hop</text><path class="ln " d="M760,260 H800"/><path class="ln " d="M60,330 H110" marker-end="url(#mv-k)"/><rect class="box " x="110" y="305" width="510" height="50" rx="2"/><text class="t1" x="365" y="327" text-anchor="middle">⊗ late reverberation at key frames</text><text class="" x="365" y="341" text-anchor="middle">ray tracing, one key frame every 0.75 s</text><path class="ln " d="M620,330 H660" marker-end="url(#mv-k)"/><rect class="box " x="660" y="305" width="100" height="50" rx="2"/><text class="t1" x="710" y="327" text-anchor="middle">Crossfade</text><text class="" x="710" y="341" text-anchor="middle">between keys</text><path class="ln " d="M760,330 H800"/><path class="ln " d="M60,400 H110" marker-end="url(#mv-k)"/><rect class="box wv" x="110" y="375" width="510" height="50" rx="2"/><text class="t1" x="365" y="397" text-anchor="middle">⊗ wave band at key frames (FDTD)</text><text class="" x="365" y="411" text-anchor="middle">one key every λ/4, by reciprocity</text><path class="ln wv" d="M620,400 H660" marker-end="url(#mv-wv)"/><rect class="box wv" x="660" y="375" width="100" height="50" rx="2"/><text class="t1" x="710" y="397" text-anchor="middle">Crossfade</text><text class="" x="710" y="411" text-anchor="middle">between keys</text><path class="ln " d="M760,400 H800"/><path class="ln " d="M760,154 H800"/><path class="ln " d="M800,154 V400"/><circle class="box" cx="840" cy="300" r="17"/><path class="ln" d="M832,300 H848 M840,292 V308"/><path class="ln " d="M800,300 H823" marker-end="url(#mv-k)"/><rect class="box " x="900" y="272" width="170" height="56" rx="2"/><text class="t1" x="985" y="297" text-anchor="middle">All sources</text><text class="" x="985" y="311" text-anchor="middle">gains, speech at 60 dB(A)</text><path class="ln " d="M857,300 H900" marker-end="url(#mv-k)"/><rect class="box " x="900" y="352" width="170" height="66" rx="2"/><text class="t1" x="985" y="375" text-anchor="middle">Diffuse background</text><text class="" x="985" y="389" text-anchor="middle">octave levels or a</text><text class="" x="985" y="403" text-anchor="middle">recording</text><path class="ln " d="M985,328 V352" marker-end="url(#mv-k)"/><path class="ln " d="M1070,378 H1150" marker-end="url(#mv-k)"/><path class="ln " d="M1070,392 H1150" marker-end="url(#mv-k)"/><text class="lab" x="1110" y="368" text-anchor="middle">binaural</text><text class="lab" x="1110" y="410" text-anchor="middle">signal</text><text class="note" x="985" y="445" text-anchor="middle">diffuse-field interaural coherence; normalisation</text></svg>
